<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Anniversary My Love</title>
  <style>
    :root {
      --bg-top: #fff7ef;
      --bg-bottom: #f5edff;
      --pink: #ff8bb3;
      --pink-deep: #d95f8a;
      --rose: #ffd9e5;
      --purple: #8467ce;
      --purple-deep: #5f489c;
      --mint: #7fe8c9;
      --mint-deep: #3da58f;
      --gold: #ffd66d;
      --cream: #fffdf7;
      --text: #4d3755;
      --shadow: rgba(91, 67, 117, 0.17);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .floaters {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .floaters span {
      position: absolute;
      font-size: clamp(1rem, 2vw, 2rem);
      opacity: 0.65;
      animation: drift 12s linear infinite;
    }

    @keyframes drift {
      0% {
        transform: translateY(110vh) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.7; }
      100% {
        transform: translateY(-10vh) scale(1.4) rotate(30deg);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(92vw, 720px);
      padding: 28px 20px 24px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(8px);
      border-radius: 34px;
      border: 3px solid rgba(255,255,255,0.85);
      box-shadow: 0 30px 80px var(--shadow);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--pink-deep);
      background: rgba(255, 221, 233, 0.9);
      padding: 8px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      color: var(--pink-deep);
    }

    .subtitle {
      margin: 10px 0 18px;
      color: #765b80;
      font-size: clamp(1.02rem, 2.4vw, 1.35rem);
      font-weight: 700;
    }

    .stage {
      position: relative;
      height: 360px;
      display: grid;
      place-items: center;
    }

    .speech {
      position: absolute;
      top: 10px;
      left: 52%;
      transform: translateX(-10%);
      min-width: 200px;
      max-width: 350px;
      background: white;
      border: 3px solid #ffffff;
      border-radius: 18px;
      box-shadow: 0 12px 26px rgba(121, 92, 151, 0.14);
      padding: 12px 16px;
      color: var(--purple);
      font-size: clamp(1rem, 2.3vw, 1.3rem);
      line-height: 1.2;
      font-weight: 800;
      z-index: 5;
    }

    .speech::after {
      content: "";
      position: absolute;
      left: 26px;
      bottom: -12px;
      width: 18px;
      height: 18px;
      background: white;
      border-right: 3px solid white;
      border-bottom: 3px solid white;
      transform: rotate(45deg);
    }

    .ground {
      position: absolute;
      bottom: 32px;
      width: 220px;
      height: 26px;
      border-radius: 50%;
      background: rgba(110, 82, 128, 0.16);
      filter: blur(2px);
      animation: shadowPulse 1.8s ease-in-out infinite;
    }

    .dragon {
      width: min(300px, 74vw);
      position: relative;
      z-index: 2;
      cursor: pointer;
      filter: drop-shadow(0 18px 12px rgba(101, 80, 145, 0.12));
      transform-origin: center bottom;
      animation: hover 2s ease-in-out infinite;
      transition: transform 0.2s ease;
    }

    .dragon:hover { transform: scale(1.02); }

    .dragon.dance {
      animation: dance 0.7s ease-in-out 3;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 12% 86%;
      animation: flap 0.85s ease-in-out infinite alternate;
    }

    .tail {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: wag 1.1s ease-in-out infinite alternate;
    }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.8s infinite;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      background: linear-gradient(135deg, #ffe5f0, #fff4c9);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 900;
      padding: 12px 18px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(210, 164, 181, 0.78);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(210, 164, 181, 0.8);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(210, 164, 181, 0.7);
    }

    .note {
      margin-top: 16px;
      font-size: 0.94rem;
      color: #7c6282;
      font-weight: 700;
    }

    @keyframes hover {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-14px) rotate(2deg); }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.75; }
      50% { transform: scaleX(0.8); opacity: 0.5; }
    }

    @keyframes flap {
      from { transform: rotate(-12deg); }
      to { transform: rotate(12deg); }
    }

    @keyframes wag {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }

    @keyframes blink {
      0%, 45%, 49%, 100% { transform: scaleY(1); }
      47% { transform: scaleY(0.08); }
    }

    @keyframes dance {
      0%, 100% { transform: rotate(0) scale(1); }
      25% { transform: rotate(-12deg) scale(1.05); }
      50% { transform: rotate(12deg) scale(1.08); }
      75% { transform: rotate(-8deg) scale(1.05); }
    }

    @media (max-width: 560px) {
      .card { padding: 24px 16px 18px; }
      .speech { left: 50%; transform: translateX(-40%); }
      .speech::after { left: 32px; }
    }
  </style>
</head>
<body>
  <div class="floaters" aria-hidden="true">
    <span style="left: 8%; animation-delay: 0s;">💖</span>
    <span style="left: 22%; animation-delay: 1.5s;">💗</span>
    <span style="left: 38%; animation-delay: 2.6s;">💞</span>
    <span style="left: 58%; animation-delay: 1.2s;">💕</span>
    <span style="left: 75%; animation-delay: 3s;">💘</span>
    <span style="left: 90%; animation-delay: 0.8s;">✨</span>
  </div>

  <main class="card">
    <div class="eyebrow">Forever & Always</div>
    <h1>Happy Anniversary</h1>
    <p class="subtitle">To the moon and back, my love 💖</p>

    <section class="stage" aria-label="Cute anniversary dragon">
      <div class="speech" id="speech">Happy anniversary to the moon and back 💖</div>
      <div class="ground" aria-hidden="true"></div>

      <svg class="dragon" id="dragon" viewBox="0 0 300 290" role="img" aria-label="Cute dragon for anniversary" tabindex="0" xmlns="http://www.w3.org/2000/svg">
        <g class="tail">
          <path d="M206 205c35 16 53 9 64-11 8 20-4 43-31 48-18 5-32-3-46-20" fill="#72dcc0" stroke="#2d8a79" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m252 198 21 5-10 16" fill="#f7d36a" stroke="#2d8a79" stroke-width="4" stroke-linejoin="round"/>
        </g>

        <g class="wing">
          <path d="M90 156c-27-41-65-46-76-32 16 11 23 30 18 42-8-1-22 8-25 15 25-6 50 7 69 35" fill="#ffc4dc" stroke="#2d8a79" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M67 162l-31-18m36 31-31-14" fill="none" stroke="#ea8ab7" stroke-width="4" stroke-linecap="round"/>
        </g>

        <ellipse cx="155" cy="190" rx="70" ry="72" fill="#7fe4c5" stroke="#2d8a79" stroke-width="5"/>
        <ellipse cx="154" cy="202" rx="42" ry="49" fill="#d9f4e7"/>
        <path d="M124 220q12 9 20 0m10 8q10 9 18 0m9-11q10 7 18 0" fill="none" stroke="#8edcbc" stroke-width="4" stroke-linecap="round"/>

        <ellipse cx="118" cy="246" rx="26" ry="16" fill="#69d0a8" stroke="#2d8a79" stroke-width="4"/>
        <ellipse cx="191" cy="246" rx="26" ry="16" fill="#69d0a8" stroke="#2d8a79" stroke-width="4"/>

        <path d="M90 112c-8-26 2-47 25-58 25 9 35 28 34 52l-10-1-7 15 8 17-25 1-15-26" fill="#7fe4c5" stroke="#2d8a79" stroke-width="5" stroke-linejoin="round"/>
        <path d="M213 112c8-26-2-47-25-58-25 9-35 28-34 52l10-1 7 15-8 17 25 1 15-26" fill="#7fe4c5" stroke="#2d8a79" stroke-width="5" stroke-linejoin="round"/>

        <ellipse cx="154" cy="129" rx="78" ry="63" fill="#87e7ca" stroke="#2d8a79" stroke-width="5"/>
        <ellipse cx="106" cy="146" rx="16" ry="9" fill="#ff9bb3" opacity="0.9"/>
        <ellipse cx="202" cy="146" rx="16" ry="9" fill="#ff9bb3" opacity="0.9"/>

        <g class="blink">
          <ellipse cx="129" cy="128" rx="10" ry="13" fill="#312f4e"/>
          <ellipse cx="179" cy="128" rx="10" ry="13" fill="#312f4e"/>
          <circle cx="132" cy="124" r="3" fill="white"/>
          <circle cx="182" cy="124" r="3" fill="white"/>
        </g>

        <ellipse cx="154" cy="150" rx="34" ry="23" fill="#d9f3e4"/>
        <ellipse cx="142" cy="147" rx="4" ry="3" fill="#2d8a79"/>
        <ellipse cx="166" cy="147" rx="4" ry="3" fill="#2d8a79"/>

        <g id="mouth-love">
          <path d="M139 160q15 18 30 0m-2 0q-11 8-26 0" fill="none" stroke="#534060" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="mouth-happy" style="display:none">
          <path d="M139 161q15 18 30 0" fill="none" stroke="#534060" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="mouth-sad" style="display:none">
          <path d="M139 170q15-18 30 0" fill="none" stroke="#534060" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="mouth-wow" style="display:none">
          <circle cx="154" cy="160" r="8" fill="#534060"/>
        </g>

        <path d="M122 81q-6-19 8-28 9 17 3 31m32-1q3-23 18-27 4 18-4 32" fill="#ffd777" stroke="#2d8a79" stroke-width="4" stroke-linejoin="round"/>
        <path d="m145 95 8-11 9 11" fill="#ff9fb7" stroke="#2d8a79" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </section>

    <div class="controls" aria-label="Anniversary messages">
      <button type="button" data-message="moon">Press 1</button>
      <button type="button" data-message="forever">Press 2</button>
      <button type="button" data-message="love">Press 3</button>
      <button type="button" data-message="dance">Press 4</button>
      <button type="button" data-message="stuck">Press 5</button>
    </div>

    <p class="note">Tap the dragon or choose a note to make it dance for you ❤️</p>
  </main>

  <script>
    const dragon = document.getElementById('dragon');
    const speech = document.getElementById('speech');
    const mouthModes = {
      love: document.getElementById('mouth-love'),
      happy: document.getElementById('mouth-happy'),
      sad: document.getElementById('mouth-sad'),
      wow: document.getElementById('mouth-wow')
    };

    const messages = {
      moon: {
        text: 'Happy anniversary to the moon and back 💖',
        mood: 'love'
      },
      forever: {
        text: 'You are my forever and always 💍',
        mood: 'happy'
      },
      love: {
        text: 'Every day with you is my favorite adventure ❤️',
        mood: 'love'
      },
      dance: {
        text: 'Let’s dance through every beautiful chapter together 💃',
        mood: 'wow'
      },
      stuck: {
        text: 'You’re stuck with me forever… and I’m so lucky 🫶',
        mood: 'happy'
      }
    };

    function setMouth(mode) {
      Object.entries(mouthModes).forEach(([key, el]) => {
        el.style.display = key === mode ? 'block' : 'none';
      });
    }

    function showMessage(key) {
      const choice = messages[key] || messages.moon;
      speech.textContent = choice.text;
      setMouth(choice.mood);
      dragon.classList.remove('dance');
      void dragon.offsetWidth;
      dragon.classList.add('dance');
    }

    document.querySelectorAll('[data-message]').forEach((button) => {
      button.addEventListener('click', () => showMessage(button.dataset.message));
    });

    dragon.addEventListener('click', () => showMessage('dance'));
    dragon.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        showMessage('dance');
      }
    });

    setMouth('love');
    showMessage('moon');
  </script>
</body>
</html>
