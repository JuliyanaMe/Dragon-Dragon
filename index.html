<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Anniversary Love</title>
  <style>
    :root {
      --bg1: #fff5ef;
      --bg2: #f5ecff;
      --pink: #ff87b5;
      --pink-dark: #d85c89;
      --purple: #8560d8;
      --mint: #7fe4c5;
      --mint-dark: #3d9c89;
      --gold: #ffd77a;
      --cream: #fffdf9;
      --text: #56385a;
      --shadow: rgba(93, 64, 115, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
    }

    .hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      font-size: clamp(1rem, 2vw, 2rem);
      opacity: 0.7;
      animation: floatUp 9s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.3) rotate(25deg);
        opacity: 0;
      }
    }

    .gift-card {
      position: relative;
      z-index: 1;
      width: min(92vw, 700px);
      background: rgba(255,255,255,0.76);
      backdrop-filter: blur(7px);
      border: 3px solid rgba(255,255,255,0.8);
      border-radius: 36px;
      box-shadow: 0 24px 70px var(--shadow);
      padding: 28px 22px 24px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--pink-dark);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 16px;
      font-weight: 700;
      color: #7d648a;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
    }

    .stage {
      position: relative;
      height: 350px;
      display: grid;
      place-items: center;
      margin-top: 10px;
    }

    .speech {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(40px);
      min-width: 180px;
      max-width: 320px;
      background: white;
      border-radius: 18px;
      border: 3px solid #fff;
      box-shadow: 0 10px 22px rgba(93, 64, 115, 0.1);
      color: var(--purple);
      font-weight: 800;
      font-size: clamp(1rem, 2vw, 1.3rem);
      padding: 12px 16px;
      line-height: 1.2;
      z-index: 5;
    }

    .speech::after {
      content: "";
      position: absolute;
      left: 26px;
      bottom: -12px;
      width: 18px;
      height: 18px;
      background: white;
      border-right: 3px solid white;
      transform: rotate(45deg);
      border-bottom: 3px solid white;
    }

    .shadow {
      position: absolute;
      bottom: 34px;
      width: 210px;
      height: 26px;
      background: rgba(101, 89, 128, 0.18);
      border-radius: 50%;
      filter: blur(2px);
      animation: shadowMove 1.8s ease-in-out infinite;
    }

    .dragon {
      width: min(290px, 72vw);
      position: relative;
      z-index: 2;
      transform-origin: center bottom;
      animation: bob 2s ease-in-out infinite;
      cursor: pointer;
      filter: drop-shadow(0 18px 10px rgba(98, 72, 122, 0.12));
      transition: transform 0.2s ease;
    }

    .dragon:hover {
      transform: scale(1.02);
    }

    .dragon.dance {
      animation: dance 0.7s ease-in-out 3;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 15% 85%;
      animation: flap 0.9s ease-in-out infinite alternate;
    }

    .tail {
      transform-box: fill-box;
      transform-origin: 6% 50%;
      animation: wag 1.1s ease-in-out infinite alternate;
    }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.5s infinite;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffe7f1, #fff7d6);
      color: var(--text);
      font-weight: 900;
      font-size: 0.96rem;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(203, 160, 179, 0.75);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(203, 160, 179, 0.8);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(203, 160, 179, 0.7);
    }

    .footer-note {
      margin-top: 15px;
      color: #826583;
      font-size: 0.95rem;
      font-weight: 700;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-14px) rotate(2deg); }
    }

    @keyframes flap {
      from { transform: rotate(-12deg); }
      to { transform: rotate(12deg); }
    }

    @keyframes wag {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }

    @keyframes blink {
      0%, 45%, 49%, 100% { transform: scaleY(1); }
      47% { transform: scaleY(0.08); }
    }

    @keyframes dance {
      0%, 100% { transform: rotate(0) scale(1); }
      25% { transform: rotate(-12deg) scale(1.04); }
      50% { transform: rotate(12deg) scale(1.06); }
      75% { transform: rotate(-8deg) scale(1.04); }
    }

    @keyframes shadowMove {
      0%, 100% { transform: scaleX(1); opacity: 0.75; }
      50% { transform: scaleX(0.78); opacity: 0.5; }
    }

    @media (max-width: 560px) {
      .gift-card { padding: 22px 16px 20px; }
      .speech { left: 52%; transform: translateX(-22%); }
      .speech::after { left: 30px; }
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart" style="left: 8%; animation-delay: 0s;">💖</span>
    <span class="heart" style="left: 26%; animation-delay: 2s;">💗</span>
    <span class="heart" style="left: 48%; animation-delay: 1s;">💞</span>
    <span class="heart" style="left: 68%; animation-delay: 3s;">💕</span>
    <span class="heart" style="left: 86%; animation-delay: 1.8s;">💘</span>
  </div>

  <main class="gift-card">
    <h1>Happy Anniversary</h1>
    <p class="subtitle">For the love of my life 💕</p>

    <section class="stage" aria-label="Cute dragon anniversary gift">
      <div class="speech" id="speech">Happy anniversary to the moon and back 💖</div>
      <div class="shadow" aria-hidden="true"></div>

      <svg class="dragon" id="dragon" viewBox="0 0 300 290" role="img" aria-label="Cute dragon" tabindex="0" xmlns="http://www.w3.org/2000/svg">
        <g class="tail">
          <path d="M206 205c34 17 50 11 61-9 8 20-5 41-31 46-17 4-31-4-44-20" fill="#6ed8b2" stroke="#2d8a79" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m249 199 20 4-10 15" fill="#fcd972" stroke="#2d8a79" stroke-width="4" stroke-linejoin="round"/>
        </g>

        <g class="wing">
          <path d="M90 156c-27-41-65-46-76-32 16 11 23 30 18 42-8-1-22 8-25 15 25-6 50 7 69 35" fill="#ffc0dc" stroke="#2d8a79" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M65 162l-28-17m34 31-31-14" fill="none" stroke="#ef8dba" stroke-width="4" stroke-linecap="round"/>
        </g>

        <ellipse cx="155" cy="190" rx="70" ry="72" fill="#7fe4c5" stroke="#2d8a79" stroke-width="5"/>
        <ellipse cx="154" cy="202" rx="42" ry="49" fill="#d8f7e8"/>
        <path d="M124 220q12 9 20 0m10 8q10 9 18 0m8-11q10 7 18 0" fill="none" stroke="#8ed9b7" stroke-width="4" stroke-linecap="round"/>

        <ellipse cx="118" cy="246" rx="26" ry="16" fill="#69d1a9" stroke="#2d8a79" stroke-width="4"/>
        <ellipse cx="191" cy="246" rx="26" ry="16" fill="#69d1a9" stroke="#2d8a79" stroke-width="4"/>

        <path d="M90 112c-8-26 2-47 25-58 25 9 35 28 34 52l-10-1-7 15 8 17-25 1-15-26" fill="#7fe4c5" stroke="#2d8a79" stroke-width="5" stroke-linejoin="round"/>
        <path d="M213 112c8-26-2-47-25-58-25 9-35 28-34 52l10-1 7 15-8 17 25 1 15-26" fill="#7fe4c5" stroke="#2d8a79" stroke-width="5" stroke-linejoin="round"/>

        <ellipse cx="154" cy="129" rx="78" ry="63" fill="#85e5c7" stroke="#2d8a79" stroke-width="5"/>
        <ellipse cx="106" cy="146" rx="16" ry="9" fill="#ff9cb5" opacity="0.85"/>
        <ellipse cx="202" cy="146" rx="16" ry="9" fill="#ff9cb5" opacity="0.85"/>

        <g class="blink">
          <ellipse cx="129" cy="128" rx="10" ry="13" fill="#3d3955"/>
          <ellipse cx="179" cy="128" rx="10" ry="13" fill="#3d3955"/>
          <circle cx="132" cy="124" r="3" fill="white"/>
          <circle cx="182" cy="124" r="3" fill="white"/>
        </g>

        <ellipse cx="154" cy="150" rx="34" ry="23" fill="#d7f5e5"/>
        <ellipse cx="142" cy="147" rx="4" ry="3" fill="#2d8a79"/>
        <ellipse cx="166" cy="147" rx="4" ry="3" fill="#2d8a79"/>

        <g id="mouth-happy">
          <path d="M139 161q15 18 30 0" fill="none" stroke="#56405d" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="mouth-love" style="display:none">
          <path d="M139 160q15 18 30 0m-3 0q-12 7-24 0" fill="none" stroke="#56405d" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="mouth-sad" style="display:none">
          <path d="M139 170q15-18 30 0" fill="none" stroke="#56405d" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="mouth-wow" style="display:none">
          <circle cx="154" cy="160" r="8" fill="#56405d"/>
        </g>

        <path d="M122 81q-6-19 8-28 9 17 3 31m32-1q3-23 18-27 4 18-4 32" fill="#ffd777" stroke="#2d8a79" stroke-width="4" stroke-linejoin="round"/>
        <path d="m145 95 8-11 9 11" fill="#ff9fb7" stroke="#2d8a79" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </section>

    <div class="controls" aria-label="Choose your anniversary message">
      <button type="button" data-message="moon">🌙 To the moon</button>
      <button type="button" data-message="forever">💍 Forever</button>
      <button type="button" data-message="love">💖 Love you</button>
      <button type="button" data-message="dance">💃 Dance</button>
      <button type="button" data-message="surprise">✨ Surprise</button>
    </div>

    <p class="footer-note">Tap the dragon to make it dance for you ❤️</p>
  </main>

  <script>
    const dragon = document.getElementById('dragon');
    const speech = document.getElementById('speech');
    const mouthModes = {
      happy: document.getElementById('mouth-happy'),
      love: document.getElementById('mouth-love'),
      sad: document.getElementById('mouth-sad'),
      wow: document.getElementById('mouth-wow')
    };

    const messages = {
      moon: {
        text: 'Happy anniversary to the moon and back 💖',
        mood: 'love'
      },
      forever: {
        text: 'You are my forever and always 💍',
        mood: 'happy'
      },
      love: {
        text: 'I love you more every day ❤️',
        mood: 'love'
      },
      dance: {
        text: 'Let’s dance through forever together 💃',
        mood: 'wow'
      },
      surprise: {
        text: 'You’re stuck with me forever… and I love it 😄',
        mood: 'happy'
      }
    };

    function setMood(mode) {
      Object.entries(mouthModes).forEach(([key, el]) => {
        el.style.display = key === mode ? 'block' : 'none';
      });
    }

    function showMessage(key) {
      const config = messages[key] || messages.moon;
      speech.textContent = config.text;
      setMood(config.mood);
      dragon.classList.remove('dance');
      void dragon.offsetWidth;
      dragon.classList.add('dance');
    }

    document.querySelectorAll('[data-message]').forEach((button) => {
      button.addEventListener('click', () => showMessage(button.dataset.message));
    });

    dragon.addEventListener('click', () => showMessage('dance'));
    dragon.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        showMessage('dance');
      }
    });

    setMood('love');
    showMessage('moon');
  </script>
</body>
</html>
